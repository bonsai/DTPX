  # --- PDL 等価性 -----------------------------------------------------------
  # すべての PDL は PageDescription の 1 実装であり、
  # Syntax をLowering で消去すると vault に落ちる。
  # 型定義: ontology/pdl.yml
  # 実装: ontology/vault.yml
  #
  # 既存_relation の置き換え:
  #   [tex, generates, pdf]
  #   [html_css, rendered_by, browser]
  #   [dxf, describes, geometry]
  #   はいずれも「pdl_lowers_to vault」に統合される。

  - [pdl, is_a, page_description]
  - [page_description, has_syntax, pdl_syntax]
  - [page_description, has_semantics, pdl_semantics]
  - [page_description, has_resolution, pdl_resolution]
  - [page_description, has_capability, pdl_capability]
  - [page_description, executed_by, interpreter]

  # 構文を消去する写像。 Syntax が無くなるのが等価の本体。
  - [pdl_syntax, eliminated_by, lowering]
  - [pdl_semantics, survives, lowering]

  - [tex, lowers_to, vault]
  - [postscript, lowers_to, vault]
  - [ghostscript_vm, lowers_to, vault]
  - [dxf, lowers_to, vault]
  - [svg, lowers_to, vault]
  - [plotter_language, lowers_to, vault]
  - [html, lowers_to, vault]

  # Vault が保持する構造。DTPX の既存語彙に写像する。
  - [vault, contains, layer]
  - [vault, contains, mark]
