  - [vault, normalizes_to, pt72]
  - [vault, records, provenance]

  # 実行が必要な形式（読むだけでは vault にならない）
  - [postscript, requires, execution]
  - [tex, requires, execution]
  - [html, requires, execution]

  # 逆変換が Onesided な形式
  - [svg, invertible_to, vault]
  - [dxf, invertible_to, vault]
  - [tex, not_invertible_to, vault]

  # Ghostscript は PDL ではなく interpreter
  - [ghostscript, interprets, postscript]
